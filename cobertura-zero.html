<script>
const byId = id => document.getElementById(id);
const report = JSON.parse(byId("report").textContent);
const route = byId("route");
const status = byId("status");
const search = byId("search");
const percentage = new Intl.NumberFormat("es-AR", { style: "percent", maximumFractionDigits: 2 });
const normalize = value => value.normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase();
byId("cutoff").textContent = "Corte del Excel · " + report.corte;
for (const number of Object.keys(report.rutas)) {
  route.add(new Option("Ruta " + number, number));
}

  const selected = route.value;
  const totals = selected ? [report.rutas[selected]] : Object.values(report.rutas);
  const base = totals.reduce((sum, [count]) => sum + count, 0);
  const buyers = totals.reduce((sum, [, count]) => sum + count, 0);
  const clients = report.clientes.filter(row => !selected || row[0] === selected);
  const listedBuyers = clients.filter(row => row[3]).length;
  const difference = buyers - listedBuyers;
  const query = normalize(search.value.trim());
  const matches = clients.filter(([, code, name, bought]) =>
    (!status.value || status.value === String(bought)) &&
    (code.includes(query) || normalize(name).includes(query))
  );

  byId("summary").textContent = buyers + " compradores de " + base + " clientes · Avance del informe";
  byId("detail").textContent = listedBuyers + " compradores y " + (clients.length - listedBuyers) + " pendientes en Campo Minado";
  byId("difference").textContent = difference
    ? "Diferencia entre el resumen y el listado del Excel: " + difference + " compradores."
    : "";
  byId("matches").textContent = matches.length ? matches.length + " clientes encontrados" : "Sin clientes para este filtro.";
  byId("clients").replaceChildren(...matches.map(([number, code, name, bought]) => {
    const item = document.createElement("li");
    const label = document.createElement("span");
    const meta = document.createElement("small");
    const badge = document.createElement("strong");
    label.textContent = name;
    meta.textContent = code + " · Ruta " + number;
    badge.textContent = bought ? "Comprador" : "Pendiente";
    badge.className = bought ? "buyer" : "pending";
    label.append(meta);
    item.append(label, badge);
    return item;
  }));
}
for (const field of [route, status, search]) field.addEventListener("input", render);
render();
</script>
</body>
</html>
