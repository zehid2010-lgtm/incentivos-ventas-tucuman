<script>
(async () => {
 const root=document.getElementById('fauna0');
 const get=id=>root.querySelector('#fc0-'+id);
 async function load(path) {
  const response = await fetch(path, {cache:"no-store"});
  if (!response.ok) throw new Error("No se pudo cargar "+path);
  return response.json();
 }
 const [report, detail] = await Promise.all([load("./choco-noviembre.json"),load("./choco-clientes.json")]);
 const data = {...report, clientes: detail.clientes};
 const productArt=JSON.parse(document.getElementById("choco-art").textContent);
 const products=[['Choco 200 ml','choco200ml',50,3],['Choco 1 L','choco1L',15,2]];
 const view=0;
 const pct=(n,b)=>(100*n/b).toLocaleString('es-AR',{maximumFractionDigits:2})+'%';
 let route='41',limit=5;
 const updated = new Date(data.updatedAt);
 get('corte').textContent = data.corte ? 'Corte del reporte · '+data.corte :
   (Number.isNaN(updated.valueOf()) ? 'Avance del reporte' : 'Recepción · '+updated.toLocaleDateString('es-AR',{timeZone:'America/Argentina/Buenos_Aires'}));

 const summary=data.avanceReporte;
 const routes=summary.porRuta;
 const gap=(r,key,goal)=>Math.max(0,Math.ceil(r.clientesBase*goal/100)-r[key]);
 const totalGap=([,key,goal])=>routes.reduce((sum,r)=>sum+gap(r,key,goal),0);
 get('mesa').innerHTML=products.map((p,i)=>{
   const [name,key,goal]=p;
   const buyers=summary[key], base=summary.clientesBase;
   const facts=[
     [pct(buyers,base), buyers+' compradores de '+base+' · Meta '+goal+'%'],
     [routes.filter(r=>gap(r,key,goal)===0).length+' de '+routes.length,'rutas en meta · Objetivo '+goal+'%'],
     [buyers+' compradores','Cobertura general '+pct(buyers,base)+' · Meta '+goal+'%'],
     [totalGap(p)+' faltantes','Suma de brechas por ruta · Meta '+goal+'%']
   ];
   return '<article class="metric"><img alt="" src="'+productArt[i]+'"><div>'+name+'<strong>'+facts[view][0]+'</strong><small>'+facts[view][1]+'</small></div></article>';
 }).join('');
 const order=view===3 ? [...routes].sort((a,b)=>products.reduce((sum,[,key,goal])=>sum+gap(b,key,goal)-gap(a,key,goal),0)) : routes;
 for(const [rank,row] of order.entries()){
  const button=document.createElement('button');
  button.type='button'; button.className='cursor-interaction'; button.dataset.route=row.ruta;
  button.innerHTML='<b>'+(view===3?(rank+1)+' · ':'')+'Ruta '+row.ruta+'</b><small>'+row.clientesBase+' clientes</small>'+products.map(([name,key,goal])=>{
   const missing=gap(row,key,goal);
   const coverage=100*row[key]/row.clientesBase;
   const label=missing?missing+' para la meta':'Meta cumplida';
   const needed=Math.ceil(row.clientesBase*goal/100);
   const steps=Array.from({length:8},(_,i)=>'<i class="'+(i<Math.floor(8*Math.min(row[key]/needed,1))?'filled':'')+'"></i>').join('');
   const indicators=[
    '<div class="ring" style="--sweep:'+coverage+'%"><strong>'+pct(row[key],row.clientesBase)+'</strong></div><small>'+label+' · Meta '+goal+'%</small>',
    '<strong>'+row[key]+' / '+needed+'</strong><small>Compradores / meta · '+label+'</small>',
    '<div class="steps" aria-hidden="true">'+steps+'</div><strong>'+row[key]+' de '+needed+'</strong><small>'+label+'</small>',
    '<div class="gap-bar" aria-hidden="true"><i style="width:'+100*missing/Math.max(1,...routes.map(r=>gap(r,key,goal)))+'%"></i></div><strong>'+missing+' faltantes</strong><small>'+pct(row[key],row.clientesBase)+' de cobertura · Meta '+goal+'%</small>'
   ];
   return '<div class="indicator"><span>'+name+'</span>'+indicators[view]+'</div>';
  }).join('');
  button.addEventListener('click',()=>{route=row.ruta;limit=5;render()});
  get('rutas').append(button);
 }
 function render(){
  for(const button of get('rutas').children)button.setAttribute('aria-pressed',String(button.dataset.route===route));
  const [name,, ,index]=products[Number(get('producto').value)];
  const status=get('estado').value;
  const search=get('buscar').value.trim().toLocaleLowerCase('es');
  const rows=data.clientes.filter(r=>r[0]===route&&(status==='all'||String(r[index])===status)&&(r[1].includes(search)||String(r[4]||'').toLocaleLowerCase('es').includes(search)));
  get('titulo').textContent='Clientes · Ruta '+route;
  get('cuenta').textContent=rows.length+' coincidencias · '+name+
    (detail.corte ? ' · Corte del listado '+detail.corte : '');
  get('clientes').replaceChildren(...rows.slice(0,limit).map(r=>{
   const li=document.createElement('li'),label=document.createElement('span'),code=document.createElement('small'),badge=document.createElement('b');
   label.textContent=r[4]||r[1];code.textContent=r[1];label.append(code);badge.textContent=r[index]?'Comprador':'Pendiente';li.append(label,badge);return li;
  }));
  get('mas').hidden=rows.length<=limit;
 }
 for(const id of ['producto','estado','buscar'])get(id).addEventListener('input',()=>{limit=5;render()});
 get('mas').addEventListener('click',()=>{limit+=10;render()});
 render();
})().catch(error => {
 console.error(error);
 document.getElementById('fc0-corte').textContent = 'No se pudo cargar el reporte. Volvé a intentar.';
});
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(console.error);</script>
</body></html>
