name: Actualizar 3 Niñas

on:
  repository_dispatch:
    types: [update_tres_ninas]

permissions:
  contents: write
  actions: write

concurrency:
  group: incentives-data-updates
  cancel-in-progress: false

jobs:
  update-tres-ninas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Actualizar tres-ninas.json sin perder compradores del mes
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as f:
              event = json.load(f)

          payload = event["client_payload"]["data"]

          incoming = {
              "incentive": "3 Niñas",
              "targets": {
                  "cream": int(payload.get("t", {}).get("cream", 35)),
                  "snacks": int(payload.get("t", {}).get("snacks", 35)),
              },
              "updatedAt": payload.get("u"),
              "rules": {
                  "buyer": "1 = comprador; 0 o vacío = no comprador"
              },
              "clients": []
          }

          for x in payload.get("c", []):
              incoming["clients"].append({
                  "route": str(x.get("r", "")),
                  "client": str(x.get("n", "")),
                  "clientId": str(x.get("i", "")),
                  "channel": str(x.get("h", "")),
                  "creamBuyer": bool(x.get("c")),
                  "snacksBuyer": bool(x.get("s")),
              })

          # El reporte BI vigente es la fuente de verdad para 3 Niñas.
          # No acumulamos estados anteriores: cada ejecución reemplaza el avance
          # con la foto actual del mes que llega en el Excel.

          with open("tres-ninas.json", "w", encoding="utf-8") as f:
              json.dump(incoming, f, ensure_ascii=False, separators=(",", ":"))
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tres-ninas.json

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
            exit 0
          fi

          git commit -m "Actualizar 3 Niñas automáticamente"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "El repositorio cambió durante la actualización. Reintentando..."
            sleep $((attempt * 2))
          done

          echo "No se pudo guardar luego de 3 intentos."
          exit 1

      - name: Forzar despliegue de GitHub Pages
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
