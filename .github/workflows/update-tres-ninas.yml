name: Actualizar 3 Niñas

on:
  repository_dispatch:
    types: [update_tres_ninas]

permissions:
  contents: write
  actions: write

concurrency:
  group: incentives-data-updates
  cancel-in-progress: false

jobs:
  update-tres-ninas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Validar y actualizar reporte Choco de noviembre
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as f:
              event = json.load(f)

          payload = event.get("client_payload", {}).get("data")
          if not isinstance(payload, dict):
              raise ValueError("Carga inválida: falta client_payload.data.")

          if payload.get("periodo") != "2026-11":
              raise ValueError("Se requiere el reporte Choco de noviembre 2026.")

          routes = {"40", "41", "42", "43"}
          metrics = ("clientesBase", "choco1L", "choco200ml")

          def validate(summary):
              if not isinstance(summary, dict) or not isinstance(summary.get("porRuta"), list):
                  raise ValueError("Falta el resumen por ruta.")
              rows = summary["porRuta"]
              if len(rows) != len(routes) or {row.get("ruta") for row in rows} != routes:
                  raise ValueError("Se requieren las rutas 40, 41, 42 y 43.")
              for row in rows:
                  if any(type(row.get(key)) is not int for key in metrics):
                      raise ValueError("Los conteos por ruta deben ser enteros.")
                  base, litro, chico = (row[key] for key in metrics)
                  if base <= 0 or not (0 <= litro <= base and 0 <= chico <= base):
                      raise ValueError("Los conteos exceden la base o son inválidos.")
              totals = {key: sum(row[key] for row in rows) for key in metrics}
              if any(type(summary.get(key)) is not int or summary[key] != value for key, value in totals.items()):
                  raise ValueError("El total no coincide con la suma de las rutas.")
              totals["porRuta"] = [{key: row[key] for key in ("ruta", *metrics)} for row in sorted(rows, key=lambda row: row["ruta"])]
              return totals

          incoming = {
              "periodo": payload["periodo"],
              "avanceReporte": validate(payload.get("avanceReporte")),
              "conteoCampoMinado": validate(payload.get("conteoCampoMinado")),
          }

          # Registrar cada reporte recibido, aunque sus indicadores no cambien.
          # Evitar restablecer valores históricos si se reenvía un adjunto viejo.
          path = "choco-noviembre.json"
          with open(path, "r", encoding="utf-8") as f:
              current = json.load(f)

          def same_metrics(previous):
              return previous.get("periodo") == incoming["periodo"] and all(
                  validate(previous.get(key)) == incoming[key]
                  for key in ("avanceReporte", "conteoCampoMinado")
              )

          current_matches = same_metrics(current)
          historical_match = False
          if not current_matches:
              revisions = subprocess.check_output(
                  ["git", "log", "--format=%H", "--", path], text=True
              ).splitlines()[1:]
              for revision in revisions:
                  blob = subprocess.run(
                      ["git", "show", f"{revision}:{path}"], capture_output=True, text=True
                  )
                  if blob.returncode:
                      continue
                  try:
                      if same_metrics(json.loads(blob.stdout)):
                          historical_match = True
                          break
                  except (ValueError, AttributeError, TypeError):
                      continue

          if historical_match:
              print("Reporte histórico repetido; no se reemplaza el avance vigente.")
          else:
              incoming["updatedAt"] = datetime.now(timezone.utc).isoformat()
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(incoming, f, ensure_ascii=False, indent=2)
                  f.write("\n")
              print("Recepción registrada; indicadores iguales." if current_matches
                    else "Nuevos indicadores registrados.")

          # Actualizar Coca Zero si Power Automate entrega la sección cocaZero.
          # Sin esa sección conservamos el corte previo; jamás inventar compradores.
          zero = payload.get("cocaZero")
          if zero is not None:
              if not isinstance(zero, dict):
                  raise ValueError("cocaZero debe ser un objeto.")
              zero_routes = zero.get("rutas")
              zero_clients = zero.get("clientes")
              if not isinstance(zero.get("corte"), str) or not zero["corte"].strip():
                  raise ValueError("Falta la fecha de corte de Coca Zero.")
              if not isinstance(zero_routes, dict) or set(zero_routes) != routes:
                  raise ValueError("Coca Zero requiere únicamente rutas 40 a 43.")
              for route, pair in zero_routes.items():
                  if (not isinstance(pair, list) or len(pair) != 2 or
                      any(type(v) is not int for v in pair) or
                      pair[0] <= 0 or not 0 <= pair[1] <= pair[0]):
                      raise ValueError("Base/compradores inválidos de Coca Zero: " + route)
              if not isinstance(zero_clients, list):
                  raise ValueError("Falta el listado de clientes de Coca Zero.")
              seen = set()
              for row in zero_clients:
                  if (not isinstance(row, list) or len(row) != 4 or
                      str(row[0]) not in routes or not str(row[1]).strip() or
                      not isinstance(row[2], str) or type(row[3]) is not int or
                      row[3] not in (0, 1)):
                      raise ValueError("Cliente inválido de Coca Zero.")
                  key = (str(row[0]), str(row[1]))
                  if key in seen:
                      raise ValueError("Cliente de Coca Zero duplicado: " + str(key))
                  seen.add(key)
              for route, (base, buyers) in zero_routes.items():
                  subset = [row for row in zero_clients if str(row[0]) == route]
                  if len(subset) != base or sum(row[3] for row in subset) != buyers:
                      raise ValueError("Coca Zero: el detalle no coincide con el resumen de ruta " + route)
              zero_path = "coca-zero.json"
              with open(zero_path, "r", encoding="utf-8") as f:
                  previous_zero = json.load(f)
              if zero != {k: previous_zero.get(k) for k in ("corte", "rutas", "clientes")}:
                  with open(zero_path, "w", encoding="utf-8") as f:
                      json.dump({k: zero[k] for k in ("corte", "rutas", "clientes")}, f, ensure_ascii=False, separators=(",", ":"))
                      f.write("\\n")
                  print("Nueva cobertura Coca Zero publicada: " + zero["corte"])
              else:
                  print("Coca Zero sin cambios.")
          else:
              print("El flujo no envió cocaZero: se mantiene la última cobertura real.")
          PY

      - name: Guardar cambios
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add choco-noviembre.json coca-zero.json

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
            exit 0
          fi

          git commit -m "Actualizar 3 Niñas automáticamente"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "El repositorio cambió durante la actualización. Reintentando..."
            sleep $((attempt * 2))
          done

          echo "No se pudo guardar luego de 3 intentos."
          exit 1

      - name: Forzar despliegue de GitHub Pages
        if: steps.save.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
