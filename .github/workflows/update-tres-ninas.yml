name: Actualizar 3 Niñas

on:
  repository_dispatch:
    types: [update_tres_ninas]

permissions:
  contents: write
  actions: write

concurrency:
  group: incentives-data-updates
  cancel-in-progress: false

jobs:
  update-tres-ninas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar y actualizar reporte Choco de noviembre
        run: |
          python - <<'PY'
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as f:
              event = json.load(f)

          payload = event.get("client_payload", {}).get("data")
          if not isinstance(payload, dict):
              raise ValueError("Carga inválida: falta client_payload.data.")

          if payload.get("periodo") != "2026-11":
              raise ValueError("Se requiere el reporte Choco de noviembre 2026.")

          routes = {"40", "41", "42", "43"}
          metrics = ("clientesBase", "choco1L", "choco200ml")

          def validate(summary):
              if not isinstance(summary, dict) or not isinstance(summary.get("porRuta"), list):
                  raise ValueError("Falta el resumen por ruta.")
              rows = summary["porRuta"]
              if len(rows) != len(routes) or {row.get("ruta") for row in rows} != routes:
                  raise ValueError("Se requieren las rutas 40, 41, 42 y 43.")
              for row in rows:
                  if any(type(row.get(key)) is not int for key in metrics):
                      raise ValueError("Los conteos por ruta deben ser enteros.")
                  base, litro, chico = (row[key] for key in metrics)
                  if base <= 0 or not (0 <= litro <= base and 0 <= chico <= base):
                      raise ValueError("Los conteos exceden la base o son inválidos.")
              totals = {key: sum(row[key] for row in rows) for key in metrics}
              if any(type(summary.get(key)) is not int or summary[key] != value for key, value in totals.items()):
                  raise ValueError("El total no coincide con la suma de las rutas.")
              totals["porRuta"] = [{key: row[key] for key in ("ruta", *metrics)} for row in rows]
              return totals

          from datetime import datetime, timezone

          incoming = {
              "periodo": payload["periodo"],
              "avanceReporte": validate(payload.get("avanceReporte")),
              "conteoCampoMinado": validate(payload.get("conteoCampoMinado")),
              "updatedAt": datetime.now(timezone.utc).isoformat()
          }
          with open("choco-noviembre.json", "w", encoding="utf-8") as f:
              json.dump(incoming, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add choco-noviembre.json

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
            exit 0
          fi

          git commit -m "Actualizar 3 Niñas automáticamente"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "El repositorio cambió durante la actualización. Reintentando..."
            sleep $((attempt * 2))
          done

          echo "No se pudo guardar luego de 3 intentos."
          exit 1

      - name: Forzar despliegue de GitHub Pages
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
