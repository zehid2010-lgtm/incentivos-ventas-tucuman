name: Actualizar Estrella Galicia

on:
  repository_dispatch:
    types: [update_estrella]

permissions:
  contents: write
  actions: write

concurrency:
  group: incentives-data-updates
  cancel-in-progress: false

jobs:
  update-estrella:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Actualizar estrella.json sin perder compradores del mes
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as f:
              event = json.load(f)

          incoming = event["client_payload"]["data"]

          try:
              with open("estrella.json", "r", encoding="utf-8") as f:
                  previous = json.load(f)
          except Exception:
              previous = {"clients": []}

          def month_key(value):
              if not value:
                  return None
              try:
                  return datetime.fromisoformat(value.replace("Z", "+00:00")).strftime("%Y-%m")
              except Exception:
                  return None

          same_month = month_key(incoming.get("updatedAt")) == month_key(previous.get("updatedAt"))

          if same_month:
              old_by_id = {
                  str(c.get("clientId")): c
                  for c in previous.get("clients", [])
                  if c.get("clientId") is not None
              }

              merged = []
              seen = set()

              for c in incoming.get("clients", []):
                  cid = str(c.get("clientId"))
                  old = old_by_id.get(cid)

                  if old and old.get("buyer") is True:
                      c["buyer"] = True

                  merged.append(c)
                  seen.add(cid)

              for cid, old in old_by_id.items():
                  if cid not in seen:
                      merged.append(old)

              incoming["clients"] = merged

          with open("estrella.json", "w", encoding="utf-8") as f:
              json.dump(incoming, f, ensure_ascii=False, separators=(",", ":"))
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estrella.json

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
            exit 0
          fi

          git commit -m "Actualizar Estrella Galicia automáticamente"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "El repositorio cambió durante la actualización. Reintentando..."
            sleep $((attempt * 2))
          done

          echo "No se pudo guardar luego de 3 intentos."
          exit 1

      - name: Forzar despliegue de GitHub Pages
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
